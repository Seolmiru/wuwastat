# 버전 태그(v0.1.0 등)를 올리면 테스트 → 포터블 ZIP 빌드 → GitHub Releases 업로드
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # Actions 탭에서 수동 실행 (빌드만 하고 결과는 아티팩트로)

permissions:
  contents: write  # 릴리스 만들기

env:
  PYTHONUTF8: "1"  # 한글 출력이 cp1252 콘솔에서 깨지지 않게
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: python -m pip install -r requirements-dev.txt

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(python -c "import wuwastat; print(wuwastat.__version__)")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "wuwastat/__init__.py 버전($v)과 태그(${GITHUB_REF_NAME})가 다릅니다"; exit 1
          fi

      - name: Test
        # 한국어 OCR 언어팩이 없는 러너에서는 OCR 테스트가 자동으로 건너뛰어진다
        run: python -m pytest -q tests

      - name: Build portable zip
        run: python tools/build_portable.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wuwastat-win64
          path: build/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # docs/release-notes/<태그>.md 가 있으면 그 패치 노트를 릴리즈 본문으로 쓴다 (앱의 업데이트 창에도 표시됨)
        run: |
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "${GITHUB_REF_NAME}" build/*.zip --title "${GITHUB_REF_NAME}" --notes-file "$notes"
          else
            gh release create "${GITHUB_REF_NAME}" build/*.zip --title "${GITHUB_REF_NAME}" --generate-notes
          fi
